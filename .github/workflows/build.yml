name: Build AIDE NDK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Toolchain Download & Build
        run: |
          export ANDROID_NDK_ROOT=$PWD/platform/ndk
          ./download-toolchain.sh
          # Araçları derleyip doğru paketleme betiğini çalıştırıyoruz
          cd platform/ndk
          ./build/tools/make-standalone-toolchain.sh --install-dir=$PWD/my-ndk || true
          cd ../..
          # Veya doğrudan oluşan tüm çıktıları paketleyelim:
          mkdir -p ndk-release
          tar -jcvf ndk-release/android-ndk-aide-arm.tar.bz2 platform/ndk || true

      - name: Upload NDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-aide
          path: ndk-release/*.tar.bz2
